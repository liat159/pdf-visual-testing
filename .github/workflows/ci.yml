
name: PDF Visual Testing CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run content tests
        run: |
          python -m pytest tests/test_report_content.py -v

      - name: Run visual regression test
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: |
          python -m pytest tests/test_report_visual.py -v

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-visual-test-artifacts
          path: |
            reports/
            sample_reports/monthly_orders_report.pdf
          if-no-files-found: warn
          retention-days: 14
